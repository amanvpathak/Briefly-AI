<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="badge">✨ AI Assistant</div>
            <h1 class="main-heading">Personal Assistant</h1>
            <p class="subtitle">Quick answers and instant email summaries</p>
        </header>

        <!-- Ask Section -->
        <section class="card">
            <div class="card-header">
                <span class="icon">💡</span>
                <h2>Ask Anything</h2>
            </div>
            <form id="askForm">
                <input type="text" name="question" placeholder="Ask a question..." required>
                <button type="submit">
                    <span>Ask AI</span>
                </button>
            </form>
            <p id="ans-loading" class="loader" style="display: none;">Thinking...</p>
            <div id="answer-wrapper">
                <p id="answer"></p>
            </div>
        </section>

        <!-- Summarize Section -->
        <section class="card">
            <div class="card-header">
                <span class="icon">✉️</span>
                <h2>Summarize Email</h2>
            </div>
            <form id="emailForm">
                <textarea name="email" placeholder="Paste your email content here..." required></textarea>
                <button type="submit">
                    <span>Summarize Email</span>
                </button>
            </form>
            <p id="summary-loading" class="loader" style="display: none;">Summarizing...</p>
            <div id="summary-wrapper">
                <p id="summary"></p>
            </div>
        </section>
    </div>

<script>
    document.getElementById("askForm").onsubmit = async (e) => {
        e.preventDefault();
        let formData = new FormData(e.target);
        let loading = document.getElementById("ans-loading");
        let answerBox = document.getElementById("answer");
        
        loading.style.display = "block";
        answerBox.innerText = "";
        answerBox.style.display = "none";

        let res = await fetch("/ask", { method: "POST", body: formData });
        let data = await res.json();
        
        answerBox.innerText = data.response;
        answerBox.style.display = "block";
        loading.style.display = "none";
    };

    document.getElementById("emailForm").onsubmit = async (e) => {
        e.preventDefault();
        let formData = new FormData(e.target);
        let loading = document.getElementById("summary-loading");
        let summaryBox = document.getElementById("summary");

        loading.style.display = "block";
        summaryBox.innerText = "";
        summaryBox.style.display = "none";

        let res = await fetch("/summarize", { method: "POST", body: formData });
        let data = await res.json();
        
        summaryBox.innerText = data.response;
        summaryBox.style.display = "block";
        loading.style.display = "none";
    };
</script>

</body>
</html>
